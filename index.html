<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cronograma do Lar</title>
<meta name="description" content="Cronograma de educação domiciliar do 1º ao 4º ano baseado em Charlotte Mason.">
<meta name="theme-color" content="#3D7369">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cronograma">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=Lexend:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: caderno de estudo calmo — papel acinzentado suave, superfícies quase brancas, cores de matéria dessaturadas usadas como filetes e tintas leves; coluna única de até 1000px. */
:root{
  --paper:#F3F3EE; --dotc:transparent; --surface:#FCFCF9; --ink:#2A302D; --muted:#69726D; --line:#E2E3DB; --soft:#EDEEE7; --accent:#3D7369; --accent-ink:#FCFCF9; --danger:#B4464B;
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Lexend","Segoe UI",system-ui,sans-serif;
  --c-bib:#A8505C; --c-cat:#7A64A8; --c-rec:#8B6A4E; --c-his:#B06A3F; --c-lin:#4775A3; --c-mat:#3E8A80; --c-cie:#5E8A48; --c-geo:#A2802E; --c-art:#A85A80; --c-mus:#5A6AAB; --c-ing:#B66E4E; --c-edf:#4F8A9C; --c-pau:#8C918C;
  --y1:#B0585C; --y2:#B27A35; --y3:#4E8A63; --y4:#52699E;
  --t-hoje:#B27A35; --t-semana:#4E8A63; --t-trimestres:#52699E; --t-horario:#7A64A8; --t-calendario:#3E8A80; --t-diario:#A85A80; --t-metodo:#8A6A4F; --t-estante:#A0643E;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1B1F1E; --dotc:transparent; --surface:#232827; --ink:#E3E6E1; --muted:#A2AAA5; --line:#343B39; --soft:#2B3130; --accent:#86B8AD; --accent-ink:#1B1F1E; --danger:#E39A9D;
  --c-bib:#D99AA2; --c-cat:#B9A8D9; --c-rec:#D2B596; --c-his:#D9A787; --c-lin:#93B4D6; --c-mat:#8CC5BC; --c-cie:#A6C795; --c-geo:#D4BC82; --c-art:#D7A0BC; --c-mus:#A3AEDB; --c-ing:#DDA98F; --c-edf:#92C2CF; --c-pau:#A6ACA8;
  --y1:#D99A9D; --y2:#D9B07E; --y3:#93C4A2; --y4:#9DB0D9;
  --t-hoje:#D9B07E; --t-semana:#93C4A2; --t-trimestres:#9DB0D9; --t-horario:#B9A8D9; --t-calendario:#8CC5BC; --t-diario:#D7A0BC; --t-metodo:#C9AD94; --t-estante:#D9A787;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1B1F1E; --dotc:transparent; --surface:#232827; --ink:#E3E6E1; --muted:#A2AAA5; --line:#343B39; --soft:#2B3130; --accent:#86B8AD; --accent-ink:#1B1F1E; --danger:#E39A9D;
  --c-bib:#D99AA2; --c-cat:#B9A8D9; --c-rec:#D2B596; --c-his:#D9A787; --c-lin:#93B4D6; --c-mat:#8CC5BC; --c-cie:#A6C795; --c-geo:#D4BC82; --c-art:#D7A0BC; --c-mus:#A3AEDB; --c-ing:#DDA98F; --c-edf:#92C2CF; --c-pau:#A6ACA8;
  --y1:#D99A9D; --y2:#D9B07E; --y3:#93C4A2; --y4:#9DB0D9;
  --t-hoje:#D9B07E; --t-semana:#93C4A2; --t-trimestres:#9DB0D9; --t-horario:#B9A8D9; --t-calendario:#8CC5BC; --t-diario:#D7A0BC; --t-metodo:#C9AD94; --t-estante:#D9A787;
  color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--paper)}
body{background-color:var(--paper);background-image:radial-gradient(var(--dotc) 1.2px,transparent 1.3px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);box-shadow:0 2px 0 var(--line)}
.crayon{height:7px;background:linear-gradient(90deg,var(--c-bib) 0 9%,var(--c-his) 9% 18%,var(--c-geo) 18% 27%,var(--c-cie) 27% 36%,var(--c-mat) 36% 45%,var(--c-edf) 45% 54%,var(--c-lin) 54% 63%,var(--c-mus) 63% 72%,var(--c-cat) 72% 81%,var(--c-art) 81% 90%,var(--c-ing) 90% 100%)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px;flex-wrap:wrap}
.brand h1{font-size:1.7rem;font-weight:800;letter-spacing:-.01em}
.brand h1 span{display:inline-block}
.brand h1 .l1{color:var(--c-bib)}.brand h1 .l2{color:var(--c-his)}.brand h1 .l3{color:var(--c-cie)}.brand h1 .l4{color:var(--c-lin)}
.brand .sub{color:var(--muted);font-size:.85rem;max-width:42ch}
.sync{font-size:.75rem;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--muted);white-space:nowrap}
.sync.on{background:color-mix(in srgb,var(--c-cie) 18%,var(--surface));color:var(--c-cie)}
.anos{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.anos button{--yc:var(--y1);flex:0 0 auto;border:2px solid var(--yc);background:var(--surface);color:var(--yc);border-radius:999px;padding:4px 14px;font-weight:800;font-size:.95rem;white-space:nowrap}
.anos button small{font-weight:600;margin-left:4px;opacity:.85}
.anos button[data-ano="2"]{--yc:var(--y2)}.anos button[data-ano="3"]{--yc:var(--y3)}.anos button[data-ano="4"]{--yc:var(--y4)}
.anos button[aria-pressed="true"]{background:var(--yc);color:var(--surface)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
nav.tabs button{--tc:var(--accent);flex:0 0 auto;background:color-mix(in srgb,var(--tc) 12%,var(--surface));border:0;border-radius:12px;padding:7px 13px;font-weight:800;color:var(--tc);font-size:.93rem;display:flex;align-items:center;gap:6px}
nav.tabs button[aria-selected="true"]{background:var(--tc);color:var(--surface);box-shadow:0 3px 0 color-mix(in srgb,var(--tc) 60%,#000)}
nav.tabs button svg{width:17px;height:17px}

main{padding-block:20px 80px}
section.view{display:grid;gap:18px}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800}
.lead{font-family:var(--f-display);font-size:2rem;font-weight:800;color:var(--vc,var(--ink))}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{padding:10px 16px;font-size:1rem}
.btn.color{background:var(--sc);border-color:var(--sc);color:var(--surface)}
.btn.ghost{border-color:transparent;background:var(--soft)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px}
.banner{border-radius:16px;padding:14px 16px;background:color-mix(in srgb,var(--bc,var(--accent)) 12%,var(--surface));border:2px solid color-mix(in srgb,var(--bc,var(--accent)) 35%,var(--surface))}
.banner strong{font-family:var(--f-display);font-size:1.2rem;display:block;margin-bottom:2px;color:var(--bc,var(--accent))}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:800;background:var(--soft);color:var(--muted);white-space:nowrap}

/* matérias */
.s-bib{--sc:var(--c-bib)}.s-cat{--sc:var(--c-cat)}.s-rec{--sc:var(--c-rec)}.s-his{--sc:var(--c-his)}.s-lin{--sc:var(--c-lin)}.s-mat{--sc:var(--c-mat)}.s-cie{--sc:var(--c-cie)}.s-geo{--sc:var(--c-geo)}.s-art{--sc:var(--c-art)}.s-mus{--sc:var(--c-mus)}.s-ing{--sc:var(--c-ing)}.s-edf{--sc:var(--c-edf)}.s-pau{--sc:var(--c-pau)}
.badge{width:34px;height:34px;border-radius:50%;background:var(--sc);color:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.85rem;flex:0 0 auto;letter-spacing:-.02em}
.badge.sm{width:24px;height:24px;font-size:.62rem}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--sc)}

/* Hoje */
.today-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.datenav{display:flex;gap:6px;align-items:center}
.datenav input{border:2px solid var(--line);border-radius:10px;padding:5px 8px;background:var(--surface)}
.timeline{display:grid;gap:10px}
.lesson{display:grid;grid-template-columns:62px 1fr auto;gap:12px;padding:12px 14px;align-items:start;background:color-mix(in srgb,var(--sc) 8%,var(--surface));border:2px solid color-mix(in srgb,var(--sc) 30%,var(--surface));border-radius:16px}
.lesson .time{font-variant-numeric:tabular-nums;font-weight:800;font-size:1rem;color:var(--sc)}
.lesson .time small{display:block;color:var(--muted);font-weight:600;font-size:.78rem}
.lesson h3{font-size:1.15rem;font-weight:800;margin:2px 0 3px}
.lesson .what{font-size:.98rem;font-weight:600}
.lesson .how{font-size:.86rem;color:var(--muted);margin-top:4px}
.lesson .acts{display:flex;flex-direction:column;align-items:center;gap:8px}
.lesson .reg{font-size:.72rem;font-weight:800;color:var(--sc);background:var(--surface);border:2px solid color-mix(in srgb,var(--sc) 40%,var(--surface));border-radius:8px;padding:3px 6px;display:flex;align-items:center;gap:3px}
.lesson .reg svg{width:14px;height:14px}
.lesson.done h3,.lesson.done .what{opacity:.55;text-decoration:line-through;text-decoration-color:var(--muted)}
.lesson.break{background:var(--soft);border-color:var(--line)}
.chk{appearance:none;width:28px;height:28px;border:3px solid var(--sc,var(--accent));border-radius:9px;background:var(--surface);display:grid;place-items:center;margin:0;flex:0 0 auto}
.chk:checked{background:var(--sc,var(--accent))}
.chk:checked::after{content:"";width:7px;height:13px;border:solid var(--surface);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.afternoon ul{margin:6px 0 0;padding-left:1.1em}
.habit{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:color-mix(in srgb,var(--c-geo) 12%,var(--surface));border-color:color-mix(in srgb,var(--c-geo) 40%,var(--surface))}
.habit .seal{width:52px;height:52px;border-radius:50%;background:var(--c-geo);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--surface);font-size:1.5rem;transform:rotate(-8deg)}

/* Semana */
.weekbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.weekbar button{flex:0 0 auto;width:42px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-variant-numeric:tabular-nums;position:relative}
.weekbar button.rest{background:var(--soft);color:var(--muted)}
.weekbar button[aria-pressed="true"]{background:var(--t-semana);color:var(--surface);border-color:var(--t-semana)}
.weekbar button .prog{position:absolute;left:5px;right:5px;bottom:4px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.weekbar button .prog i{display:block;height:100%;background:var(--c-cie)}
.weekbar button[aria-pressed="true"] .prog i{background:var(--surface)}
.termsel{display:flex;gap:6px;flex-wrap:wrap}
.termsel button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 14px;font-weight:800}
.termsel button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:2px solid color-mix(in srgb,var(--sc) 35%,var(--surface));border-radius:16px;overflow:hidden;display:grid;align-content:start;min-width:0}
.card .head{display:flex;justify-content:space-between;align-items:center;gap:8px;background:color-mix(in srgb,var(--sc) 14%,var(--surface));padding:10px 12px}
.card .head .tag{font-size:.82rem}
.card .body{padding:12px;display:grid;gap:8px}
.card .assign{font-family:var(--f-display);font-size:1.15rem;font-weight:700;line-height:1.25}
.card .meta{font-size:.86rem;color:var(--muted)}
.card ul{margin:0;padding-left:1.1em;font-size:.9rem}
.card.done{opacity:.72}
.progress{height:12px;background:var(--soft);border-radius:6px;overflow:hidden;flex:1;min-width:120px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--c-cie),var(--c-mat))}

/* Trimestres */
.scroll{overflow-x:auto;border-radius:16px;border:2px solid var(--line);background:var(--surface)}
table.ov{border-collapse:collapse;width:100%;min-width:760px;font-size:.92rem}
table.ov th,table.ov td{border-bottom:2px solid var(--line);padding:12px;vertical-align:top;text-align:left}
table.ov thead th{font-family:var(--f-display);font-size:1.1rem;background:var(--soft)}
table.ov thead th:nth-child(2){color:var(--y1)}table.ov thead th:nth-child(3){color:var(--y2)}table.ov thead th:nth-child(4){color:var(--y3)}
table.ov thead th small{display:block;font-family:var(--f-body);font-weight:600;color:var(--muted);font-size:.78rem}
table.ov th[scope=row]{width:180px;background:color-mix(in srgb,var(--sc) 16%,var(--surface))}
table.ov th[scope=row] .in{display:flex;gap:8px;align-items:center;color:var(--sc);font-family:var(--f-display);font-size:1.02rem}
table.ov td{border-left:2px solid var(--line);background:color-mix(in srgb,var(--sc) 4%,var(--surface))}
table.ov td .r{font-weight:800;margin-bottom:4px}
table.ov td ol{margin:4px 0 0;padding-left:1.2em;color:var(--muted);font-size:.84rem}

/* Horário */
.tt{border-collapse:separate;border-spacing:4px;width:100%;min-width:720px;font-size:.88rem}
.tt th,.tt td{padding:8px;vertical-align:top;border-radius:10px}
.tt thead th{background:var(--soft);font-family:var(--f-display);font-size:1rem}
.tt td.t{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap;width:78px}
.tt td.t small{display:block;color:var(--muted);font-weight:600}
.tt td.c{background:color-mix(in srgb,var(--sc) 16%,var(--surface))}
.tt td.c b{color:var(--sc);display:block}
.tt td.af{background:var(--soft);font-size:.82rem}

/* Calendário */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cal .y{--yc:var(--y1);background:var(--surface);border:2px solid color-mix(in srgb,var(--yc) 40%,var(--surface));border-radius:16px;padding:14px;display:grid;gap:10px}
.cal .y[data-y="2"]{--yc:var(--y2)}.cal .y[data-y="3"]{--yc:var(--y3)}.cal .y[data-y="4"]{--yc:var(--y4)}
.cal .y h3{color:var(--yc);font-size:1.4rem}
.cal .y.now{box-shadow:0 0 0 3px var(--yc)}
.cal .t{display:grid;gap:2px;padding-left:10px;border-left:4px solid color-mix(in srgb,var(--yc) 50%,var(--surface))}
.cal .t b{font-variant-numeric:tabular-nums}
.cal .t span{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.settings{display:grid;gap:12px}
.settings label{display:grid;gap:4px;font-weight:800;font-size:.9rem}
.settings input[type=date],.settings select{border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--surface);max-width:260px}
.toggle{display:flex!important;align-items:center;gap:8px;font-weight:600!important}

/* Método */
.principles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.principles .panel{border-color:color-mix(in srgb,var(--sc) 35%,var(--surface));background:color-mix(in srgb,var(--sc) 7%,var(--surface))}
.principles .panel h3{font-size:1.15rem;margin-bottom:6px;color:var(--sc)}
.principles .panel p{margin:0;font-size:.93rem}
.mlist{display:grid;gap:10px}
.mitem{background:var(--surface);border:2px solid color-mix(in srgb,var(--sc) 35%,var(--surface));border-radius:16px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:12px}
.mitem h3{font-size:1.2rem;color:var(--sc)}
.mitem p{margin:6px 0 0;font-size:.95rem}
.mitem .ref{font-size:.8rem;color:var(--muted);margin-top:6px}
.foot{font-size:.82rem;color:var(--muted);padding-top:10px;border-top:2px solid var(--line)}

/* Diário */
.dtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:10px;padding:6px 12px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--t-diario);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{flex:0 0 auto;border:2px solid color-mix(in srgb,var(--sc,var(--accent)) 45%,var(--surface));background:var(--surface);color:var(--sc,var(--ink));border-radius:999px;padding:4px 12px;font-weight:800;font-size:.85rem;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--sc,var(--ink));color:var(--surface);border-color:var(--sc,var(--ink))}
.form{display:grid;gap:14px;border-color:color-mix(in srgb,var(--t-diario) 45%,var(--surface));background:color-mix(in srgb,var(--t-diario) 5%,var(--surface))}
.form h2{font-size:1.5rem;color:var(--t-diario)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:grid;gap:4px;font-weight:800;font-size:.88rem;min-width:0}
.field input,.field select,.field textarea{border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);font-weight:500;width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical}
.field .hint{font-weight:500;color:var(--muted);font-size:.8rem}
.status{display:flex;gap:6px;flex-wrap:wrap}
.status button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.85rem}
.status button[aria-pressed="true"][data-st="ok"]{background:var(--c-cie);border-color:var(--c-cie);color:var(--surface)}
.status button[aria-pressed="true"][data-st="and"]{background:var(--c-geo);border-color:var(--c-geo);color:var(--surface)}
.status button[aria-pressed="true"][data-st="rev"]{background:var(--c-his);border-color:var(--c-his);color:var(--surface)}
.stp{border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:800;color:var(--surface)}
.stp.ok{background:var(--c-cie)}.stp.and{background:var(--c-geo)}.stp.rev{background:var(--c-his)}
.photobtns{display:flex;gap:8px;flex-wrap:wrap}
.photobtns label{cursor:pointer;position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px}
.photobtns input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:60px;margin:0}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

   m:"O Breve Catecismo de Westminster tem 107 perguntas, divididas em três blocos por ano (1–36, 37–72, 73–107). No 1º ano o foco é recitar; no 2º, entender com explicações e versículos-prova; no 3º, recitar e copiar as respostas (transcrição); no 4º, recitar e explicar com as próprias palavras. Assim como na recitação de poemas, a criança aprende pela repetição atenta, sem decoreba cansativa.",
   ref:"Parte V, Cap. VII – Recitação; Apêndice B (respostas do catecismo com explicações)"},
 rec:{n:"Recitação",how:"Poucos versos por dia: a criança ouve, repete e diz com expressão, sem decorar à força.",
   m:"Recitar é a ‘arte infantil’: a criança aprende a dizer belos pensamentos de forma bela, encontrando ela mesma a expressão certa, sem imitar o tom do professor. Escolha um Salmo e poemas de qualidade por trimestre. Leia alguns versos em voz alta todos os dias; com a repetição atenta, a criança passa a dizê-los de cor naturalmente. No fim do trimestre, ela recita para a família.",
   ref:"Parte V, Cap. VII – Recitação"},
 his:{n:"História do Brasil",how:"Leia 2 a 3 páginas de um livro vivo e peça a narração. Escreva nomes difíceis no quadro.",
   m:"História se aprende por livros vivos e histórias de pessoas, não por resumos secos. Leia de forma contínua um bom livro, 2 ou 3 páginas por vez, e peça a narração, sem corrigir nem completar com palavras do texto. Escreva nomes próprios difíceis no quadro e apague quando a criança disser que os vê de olhos fechados. Ilustrações feitas pela criança e uma linha do tempo na parede ajudam a fixar.",
   ref:"Parte V, Cap. XVIII – História; Cap. IX – A Arte da Narração"},
 lin:{n:"Linguagem e Literatura",how:"Leitura, caligrafia e narração em lições curtas. Leia o livro de literatura e peça que a criança conte de novo.",
   m:"Leitura: primeiro os sons das letras (letras na areia), depois palavras inteiras ligadas a ideias interessantes. Narração: a partir dos 6 anos, leia uma vez e peça que a criança conte de novo, sem interromper nem corrigir; até os 9 anos, redação é narração oral. Caligrafia: lições de 5 a 10 minutos, poucas letras perfeitas por vez. Transcrição (7–8 anos): cópia lenta e bonita de versos favoritos. Ditado (8–9 anos): a criança prepara um parágrafo, ‘vê’ as palavras de olhos fechados e só então escreve. Recitação: Salmos e poemas ditos com beleza. Literatura: apenas clássicos infantis, lidos sem diluir com explicações.",
   ref:"Parte V, Caps. IV a XIII e XIX"},
 mat:{n:"Matemática",how:"A família escolhe o material. Use problemas pequenos e reais; demonstre com objetos.",
   m:"A família escolhe seu material de matemática; os tópicos abaixo servem de guia de progressão. Coloque a matemática no começo da manhã, com a mente descansada. Use problemas pequenos, ao alcance da criança e ligados à vida (maçãs, moedas, receitas), em vez de longas contas. Demonstre com objetos tudo o que puder ser demonstrado. Exija exatidão: em aritmética não existe ‘quase certo’. Use os termos ‘unidades’ e ‘dezenas’ desde o início.",
   ref:"Parte V, Cap. XV – Aritmética; Apêndices A e B"},
 cie:{n:"Ciências",how:"Observe ao vivo. Registre no diário da natureza com desenho e uma frase.",
   m:"Ciência começa com observação direta: saídas de campo, o quintal, a praça. Cada criança mantém um diário da natureza com desenhos a pincel (aquarela) e anotações do que viu, com data. Complementa-se com livros de naturalistas. Na filosofia natural (água, ar, luz, calor), nada deve ser ensinado sem o devido experimento simples feito pela própria criança.",
   ref:"Parte II, Caps. I a VIII; Parte V, Cap. XVI – Filosofia Natural"},
 geo:{n:"Geografia",how:"Comece ao ar livre ou na bandeja de areia. Use o mapa antes e depois da lição.",
   m:"As primeiras ideias de geografia vêm ao ar livre: morros, vales, córregos e planícies da vizinhança, que a criança depois reproduz na bandeja de areia ou desenha. As definições (ilha, lago, rio) surgem da experiência, nunca decoradas. Depois vêm leituras vivas sobre povos e lugares e o uso constante de mapas: perguntas no mapa antes da lição e mapas desenhados de memória.",
   ref:"Parte II, Cap. IX – Geografia ao Ar Livre; Parte V, Cap. XVII – Geografia"},
 art:{n:"Artes e Artesanato",how:"Uma obra por semana: olhar em silêncio, guardar a imagem e descrever de memória.",
   m:"Um artista por trimestre, cerca de seis obras. Mostre a obra e deixe a criança observar em silêncio por 3 a 4 minutos; retire a imagem e peça que descreva o que viu; depois converse sobre a ideia do artista e, se quiser, faça um esboço de memória em 5 minutos. Desenho com pincel a partir da natureza (galhos, folhas, aves). Trabalhos manuais lentos e bem-feitos, dentro da capacidade da criança: dobraduras, argila, costura em tela, tricô com agulhas grossas, caixas e cestos.",
   ref:"Parte V, Cap. XXI – Arte Pictórica; Trabalhos Manuais"},
 mus:{n:"Música",how:"Ouça uma obra do compositor várias vezes durante a semana. Cante o hino do mês.",
   m:"Um compositor por trimestre: uma obra por semana, ouvida várias vezes, com uma breve história da vida do compositor. Cantar hinos e cantigas diariamente. O aprendizado de um instrumento é altamente recomendado, com teoria e ouvido acompanhando a prática.",
   ref:"Parte V, Cap. XXI – Canto e Música; Apêndices A e B"},
 ing:{n:"Inglês",how:"Oral primeiro: histórias, canções e séries de ações. Faça frases novas com as palavras.",
   m:"O livro trata do francês, e o mesmo método serve para o inglês: primeiro o ouvido e a fala, por meio de histórias, canções e das ‘séries de ações’ de Gouin (sequências como levantar, lavar o rosto, vestir-se), dizendo cada ação enquanto se faz. A criança forma frases novas com as palavras aprendidas. Leitura e escrita só vêm depois, no 3º e 4º anos.",
   ref:"Parte V, Cap. XX – Francês (método aplicado à língua estrangeira)"},
 edf:{n:"Educação Física",how:"Exercícios simples, brincadeiras e muito tempo ao ar livre.",
   m:"Exercícios físicos diários simples (como a ginástica sueca), danças e brincadeiras de roda, e longas horas ao ar livre todos os dias, em quase qualquer tempo. As tardes livres ao ar livre fazem parte do método, não são um intervalo dele.",
   ref:"Parte II, Caps. XI e XIV; Parte III, Cap. IX; Parte V, Cap. XXI"}
};

/* ---------- cálculo semanal ---------- */
function bibleWeek(ano,t,w){
  const T=BIB[ano][t-1];
  const chunk=segs=>{
    const list=[];segs.forEach(([b,a,z])=>{for(let c=a;c<=z;c++)list.push([b,c])});
    const n=list.length,s=Math.floor((w-1)*n/11),e=Math.max(s+1,Math.floor(w*n/11));
    return fmtRange(list.slice(s,Math.min(e,n)));
  };
  return {at:chunk(T.at),nt:chunk(T.nt)};
}
function fmtRange(items){
  if(!items.length)return "revisão";
  const groups=[];
  items.forEach(([b,c])=>{const g=groups[groups.length-1];if(g&&g.b===b&&g.z===c-1)g.z=c;else groups.push({b,a:c,z:c})});
  const out=[];let last=null;
  groups.forEach(g=>{const r=g.a===g.z?""+g.a:g.a+"–"+g.z;if(g.b===last)out[out.length-1]+=", "+r;else{out.push(g.b+" "+r);last=g.b}});
  return out.join("; ");
}
function catWeek(t,w){
  const [a,z]=CATR[t-1],n=z-a+1;
  const s=a+Math.floor((w-1)*n/11),e=a+Math.floor(w*n/11)-1;
  return e<=s?"Pergunta "+s:"Perguntas "+s+" a "+e;
}
function recOf(ano,t){const it=(C[ano].lin[t-1].t||[]).find(x=>x.startsWith("Recitação"));return it?it.replace(/^Recitação:\s*/,""):"Salmo ou poema escolhido pela família"}
function termData(ano,k,t){
  if(k==="rec"){return {r:recOf(ano,t),t:[]}}
  if(k==="lin"){const d=C[ano].lin[t-1];return Object.assign({},d,{t:d.t.filter(x=>!x.startsWith("Recitação"))})}
  if(k==="bib")return {r:BIB[ano][t-1].r};
  if(k==="cat"){const [a,z]=CATR[t-1];return {r:"Catecismo de Westminster, perguntas "+a+" a "+z+" "+CATV[ano]}}
  if(k==="edf")return EDF[0];
  return C[ano][k][t-1];
}
function topicOf(list,w){return list[Math.min(list.length-1,Math.floor((w-1)*list.length/11))]}
function assignment(ano,k,t,w){
  if(k==="bib"){const b=bibleWeek(ano,t,w);return {main:"AT: "+b.at,sub:"NT: "+b.nt}}
  if(k==="rec"){return {main:recOf(ano,t),sub:"Alguns versos por dia, até a criança dizer de cor"}}
  if(k==="cat"){return {main:catWeek(t,w),sub:CATV[ano][0].toUpperCase()+CATV[ano].slice(1)}}
  const d=termData(ano,k,t);
  return {main:topicOf(d.t,w),sub:d.x||""};
}

/* ---------- calendário ---------- */
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function mondayOnOrAfter(d){const x=new Date(d);while(x.getDay()!==1)x.setDate(x.getDate()+1);return x}
function fmt(d,o){return d.toLocaleDateString("pt-BR",o||{day:"2-digit",month:"short"}).replace(".","")}
function settings(){return {start:store.get("start","2027-02-01"),ano0:store.get("ano0",1),julho:store.get("julho",true)}}
function yearPlan(ano){
  const st=settings();const base=parseISO(st.start);
  const yOff=ano-st.ano0;
  const s0=mondayOnOrAfter(yOff===0?base:new Date(base.getFullYear()+yOff,base.getMonth(),base.getDate()));
  const terms=[];let cur=s0;
  for(let t=1;t<=3;t++){
    if(t===3&&st.julho)cur=addDays(cur,14);
    terms.push({t,start:cur,instrEnd:addDays(cur,7*11-3),restStart:addDays(cur,77),end:addDays(cur,7*12-3)});
    cur=addDays(cur,84);
  }
  return {ano,start:s0,end:terms[2].end,terms};
}
function locate(date){
  const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());
  for(let ano=1;ano<=4;ano++){
    const p=yearPlan(ano);
    for(const T of p.terms){
      const last=addDays(T.start,83);
      if(d>=T.start&&d<=last){const w=Math.floor((d-T.start)/864e5/7)+1;return {ano,t:T.t,w,dow:d.getDay(),plan:p}}
    }
    if(d>=p.start&&d<=p.end)return {ano,gap:true,plan:p,dow:d.getDay()};
  }
  return null;
}

/* IndexedDB local */
let idbP=null;
function idb(){
  if(idbP)return idbP;
  idbP=new Promise((res,rej)=>{
    try{const r=indexedDB.open("cronograma-do-lar",1);
      r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("registros"))d.createObjectStore("registros",{keyPath:"id"});if(!d.objectStoreNames.contains("fotos"))d.createObjectStore("fotos",{keyPath:"id"})};
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}
  });
  return idbP;
}
function tx(storeName,mode,fn){return idb().then(d=>new Promise((res,rej)=>{const t=d.transaction(storeName,mode);const s=t.objectStore(storeName);const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)}))}
const localDB={
  all(){return tx("registros","readonly",s=>s.getAll())},
  put(r){return tx("registros","readwrite",s=>s.put(r))},
  del(id){return tx("registros","readwrite",s=>s.delete(id))},
  putPhoto(id,blob){return tx("fotos","readwrite",s=>s.put({id,blob}))},
  getPhoto(id){return tx("fotos","readonly",s=>s.get(id))},
  delPhoto(id){return tx("fotos","readwrite",s=>s.delete(id))}
};

function photoSrc(f){
  if(f.cloud)return "/_blob/"+f.id;
  if(f.db){
    if(urlCache[f.id])return urlCache[f.id];
    if(cloud.db)cloud.db.collection("fotos").doc(f.id).get().then(snap=>{const d=snap.exists&&snap.data();if(d&&d.src){urlCache[f.id]=d.src;document.querySelectorAll('img[data-pid="'+f.id+'"]').forEach(i=>i.src=d.src)}}).catch(()=>{});
    return "data:image/gif;base64,R0lGODlhAQABAAAAACw=";
  }
  if(urlCache[f.id])return urlCache[f.id];
  localDB.getPhoto(f.id).then(r=>{if(r&&r.blob){urlCache[f.id]=URL.createObjectURL(r.blob);document.querySelectorAll('img[data-pid="'+f.id+'"]').forEach(i=>i.src=urlCache[f.id])}}).catch(()=>{});
  return "data:image/gif;base64,R0lGODlhAQABAAAAACw=";
}

async function decodeImg(file){
  try{return await createImageBitmap(file)}catch(e){}
  return await new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error("decode"));im.src=u});
}
async function smallDataURL(blob){
  const bmp=await decodeImg(blob);const W=bmp.width||bmp.naturalWidth,H=bmp.height||bmp.naturalHeight;
  for(const max of [1280,1024,800,640]){
    const sc=Math.min(1,max/Math.max(W,H));const c=document.createElement("canvas");c.width=Math.round(W*sc);c.height=Math.round(H*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    for(const q of [0.75,0.6,0.5]){const u=c.toDataURL("image/jpeg",q);if(u.length<230000)return u}
  }
  throw new Error("toolarge");
}
async function compress(file){
  try{
    const bmp=await decodeImg(file);
    const W=bmp.width||bmp.naturalWidth,H=bmp.height||bmp.naturalHeight;
    const max=1600,s=Math.min(1,max/Math.max(W,H));
    const c=document.createElement("canvas");c.width=Math.round(W*s);c.height=Math.round(H*s);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
    return b||file;
  }catch(e){return file}
}
async function storePhoto(blob){
  if(cloud.mode==="cloud"){
    if(cloud.assets){
      try{const r=await cloud.assets.upload(blob,{type:blob.type||"image/jpeg"});return {id:r.id,cloud:true}}
      catch(e){if(e&&(e.code==="rate_limited"||e.code==="store_unavailable"))throw e;cloud.assets=null}
    }
    const src=await smallDataURL(blob);const id="p"+newId();
    await cloud.db.collection("fotos").doc(id).set({src,ts:Date.now()});
    urlCache[id]=src;return {id,db:true};
  }
  const id="f"+newId();await localDB.putPhoto(id,blob);urlCache[id]=URL.createObjectURL(blob);return {id,cloud:false};
}

function slotMatches(u,s,dow){
  if(slotSubject(s,dow)!==u.k)return false;
  if(u.slot)return slotLabel(s,dow).includes(u.slot);
  if(u.k==="lin")return slotLabel(s,dow).includes("Literatura");
  return true;
}
function sessions(u){
  const key=[u.id,u.ano,u.t,u.k,u.w0,u.w1,(u.days||[]).join(".")].join("|");
  if(sessCache[key])return sessCache[key];
  const g=TT[grp(u.ano)],out=[];
  for(let w=Math.max(1,u.w0);w<=Math.min(11,u.w1);w++)for(let d=1;d<=5;d++){
    if(u.days&&!u.days.includes(d))continue;
    if(g.slots.some(s=>slotMatches(u,s,d)))out.push(w*10+d);
  }
  return sessCache[key]=out;
}
function unitText(u,j0,j1,N){
  const lab=UNITS[u.unit]||["",""];
  if(u.from==null||u.to==null||isNaN(u.from)||isNaN(u.to)||u.to<u.from)
    return {txt:(j0===j1?"Aula "+(j0+1):"Aulas "+(j0+1)+" a "+(j1+1))+" de "+N,need:true};
  const U=u.to-u.from+1;
  let s=u.from+Math.floor(j0*U/N),e=u.from+Math.floor((j1+1)*U/N)-1,cont=false;
  if(e<s){e=s;cont=j0>0&&u.from+Math.floor((j0-1)*U/N)===s}
  return {txt:(s===e?lab[0]+" "+s:lab[1]+" "+s+"–"+e)+(cont?" (continuação)":""),need:false};
}

function lessonBooks(ano,t,w,dow,s){
  const out=[];
  allUses().forEach(u=>{
    if(u.ano!==ano||u.t!==t||w<u.w0||w>u.w1)return;
    if(!slotMatches(u,s,dow))return;
    if(u.days&&!u.days.includes(dow))return;
    const ss=sessions(u);const j=ss.indexOf(w*10+dow);if(j<0)return;
    const r=unitText(u,j,j,ss.length);
    out.push({u,txt:r.txt,need:r.need});
  });
  return out;
}

    if(u.ano!==ano||u.t!==t||u.k!==k||w<u.w0||w>u.w1)return;
    const ss=sessions(u);const idx=ss.map((x,i)=>Math.floor(x/10)===w?i:-1).filter(i=>i>=0);
    if(!idx.length)return;

    out.push({u,txt:r.txt,need:r.need,dias});
  });

}

/* Bíblia do dia: AT seg/qua/sex, NT ter/qui */
function bibWeekLists(ano,t,w){
  const T=BIB[ano][t-1];
  const chunk=segs=>{const list=[];segs.forEach(([b,a,z])=>{for(let c=a;c<=z;c++)list.push([b,c])});
    const n=list.length,s=Math.floor((w-1)*n/11),e=Math.max(s+1,Math.floor(w*n/11));return list.slice(s,Math.min(e,n))};
  return {at:chunk(T.at),nt:chunk(T.nt)};
}
function splitDay(list,D,j){
  const n=list.length;if(!n)return "revisão";
  if(n>=D)return fmtRange(list.slice(Math.floor(j*n/D),Math.floor((j+1)*n/D)));
  const i=Math.floor(j*n/D);const cont=j>0&&Math.floor((j-1)*n/D)===i;
  return fmtRange([list[i]])+(cont?" (continuação)":"");
}
function bibleDay(ano,t,w,dow){
  const L=bibWeekLists(ano,t,w);
  if(dow===2||dow===4)return {lab:"Novo Testamento",ref:splitDay(L.nt,2,dow===2?0:1)};
  return {lab:"Antigo Testamento",ref:splitDay(L.at,3,dow===1?0:dow===3?1:2)};
}

/* ---------- Hoje ---------- */
function slotSubject(s,dow){return s.rot?s.rot[dow]:s.k}
function slotLabel(s,dow){if(s.alt&&s.alt[dow])return s.alt[dow];if(s.rot)return S[s.rot[dow]].n;return s.l}
function lessonWhat(ano,t,w,k,label){
  const a=assignment(ano,k,t,w);let what=a.main;
  if(k==="lin"){
    const l=label.toLowerCase();
    if(l.includes("literatura"))what=(termData(ano,"lin",t).x||"Livro do trimestre").replace("Literatura do trimestre: ","");
    else if(l.includes("caligrafia"))what=ano===1?"Caligrafia: "+["letras redondas (o, a, c, d)","letras de haste (l, b, h, k)","letras que descem (g, j, p, q)"][t-1]:"Letra cursiva: duas letras perfeitas";
    else if(l.includes("leitura"))what=ano===1?"Leitura: "+a.main:"Leitura em voz alta: 1 página do livro do trimestre";
    else if(l.includes("ditado"))what="Preparar um parágrafo e ditá-lo, oração por oração";
    else if(l.includes("transcrição"))what="Copiar devagar um verso ou trecho favorito";
    else if(l.includes("gramática"))what=/gramática|análise/i.test(a.main)?a.main:"Gramática: classes de palavras com frases do livro de leitura";
  }

  if(k==="bib")what=a.main+" · "+a.sub;
  return what;
}
function lessonWhatDay(ano,t,w,k,label,dow,bks){
  if(k==="bib"){const b=bibleDay(ano,t,w,dow);return b.lab+": "+b.ref}
  if(k==="lin"&&label.toLowerCase().includes("literatura")&&bks.length)return "Ler o trecho do dia em voz alta e pedir a narração";
  return lessonWhat(ano,t,w,k,label);
}
function dayLessons(ano,t,w,dow,dateKey){
  const g=TT[grp(ano)];
  const rows=g.slots.map((s,i)=>{
    const k=slotSubject(s,dow);
    if(k==="pau")return `<div class="lesson break s-pau"><div class="time">${s.h}<small>${s.m} min</small></div><div><h3>${esc(s.l)}</h3><div class="how">Lanche, água e movimento livre.</div></div><span></span></div>`;
    const label=slotLabel(s,dow);
    const bks=lessonBooks(ano,t,w,dow,s);
    const what=lessonWhatDay(ano,t,w,k,label,dow,bks);
    const key="d:"+dateKey+":"+i;const done=isDone(key);
    const tip=s.tip||S[k].how;
    let blines=bks.map(x=>bookLine(x)).join("");
    if(k==="bib"&&mhOn()){const b=bibleDay(ano,t,w,dow);blines=`<div class="bk prep"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg><span>Preparação dos pais: <b>Comentário Bíblico de Matthew Henry</b> — ${esc(b.ref)}</span></div>`+blines}
    const nfotos=recs.filter(r=>r.date===dateKey&&r.subj===k).reduce((n,r)=>n+(r.fotos||[]).length,0);
    return `<div class="lesson s-${k}${done?" done":""}"><div class="time">${s.h}<small>${s.m} min</small></div><div><span class="tag">${badge(k,true)}${esc(S[k].n)}</span><h3>${esc(label)}</h3><div class="what">${esc(what)}</div>${blines?`<div class="bks">${blines}</div>`:""}<div class="how">${esc(tip)}</div></div><div class="acts"><input class="chk" type="checkbox" id="c-${esc(key)}" data-key="${esc(key)}" data-label="${esc(label+" · "+what)}" ${done?"checked":""} aria-label="Concluída: ${esc(label)}">${dateKey!=="previa"?`<button type="button" class="reg" data-reg="${k}" data-rdate="${dateKey}" data-rlabel="${esc(label+": "+what)}" aria-label="Registrar aula de ${esc(S[k].n)}">${svg("cam",14)}${nfotos?nfotos:""}</button>`:""}</div></div>`;
  });
  rows.push(`<div class="lesson break s-pau"><div class="time">${g.end}</div><div><h3>Fim das lições da manhã</h3></div><span></span></div>`);
  return `<div class="timeline">${rows.join("")}</div>`;
}
function vHoje(){
  const date=st.day?parseISO(st.day):new Date();
  const dk=iso(date);
  const loc=locate(date);
  const nav=`<div class="datenav"><button class="btn" type="button" data-day="-1" aria-label="Dia anterior">‹</button><input type="date" id="daypick" value="${dk}" aria-label="Escolher data"><button class="btn" type="button" data-day="1" aria-label="Próximo dia">›</button><button class="btn" type="button" data-day="0">Hoje</button></div>`;
  const head=(eyebrow,lead)=>`<div class="today-head"><div><div class="eyebrow">${eyebrow}</div><div class="lead">${lead}</div></div>${nav}</div>`+lastBanner();
  const dayTitle=DAYN[date.getDay()]+", "+date.toLocaleDateString("pt-BR",{day:"numeric",month:"long",year:"numeric"});
  if(!loc){
    const p1=yearPlan(settings().ano0);
    if(date<p1.start){
      const days=Math.ceil((p1.start-date)/864e5);const ano=settings().ano0;
      return head(dayTitle,"Faltam "+days+" dias para começar!")+
        `<div class="banner" style="--bc:var(--t-hoje)"><strong>O ${ano}º ano começa em ${fmt(p1.start,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</strong>Abaixo, a prévia do primeiro dia de aula. A data de início pode ser mudada na aba Calendário.</div>`+
        habitBox(ano,1)+`<div class="eyebrow">Prévia · Segunda-feira · 1º trimestre, semana 1</div>`+dayLessons(ano,1,1,1,"previa")+afternoon(1);
    }
    return head(dayTitle,"Fora do calendário escolar")+`<div class="banner"><strong>Os quatro anos letivos já terminaram nesta data.</strong>Ajuste a data de início na aba Calendário, se precisar.</div>`;
  }
  if(loc.gap)return head(dayTitle,"Férias!")+`<div class="banner" style="--bc:var(--c-geo)"><strong>Férias de julho do ${loc.ano}º ano</strong>Duas semanas entre o 2º e o 3º trimestre. Aproveite para passeios, museus e tempo ao ar livre.</div>`;
  const {ano,t,w,dow}=loc;
  const eb=`${ano}º ano · ${t}º trimestre · semana ${w} de 12`;
  if(dow===0||dow===6)return head(eb,dayTitle)+`<div class="banner" style="--bc:var(--c-cie)"><strong>Fim de semana</strong>Sem lições. Um bom dia para passeio em família, leitura juntos e o culto.</div>`+habitBox(ano,t);
  if(w===12)return head(eb,dayTitle)+`<div class="banner" style="--bc:var(--c-edf)"><strong>Semana de descanso</strong>Sem lições formais. Revise o diário da natureza, organize os cadernos, faça passeios e prepare os livros do próximo trimestre.</div>`;
  st.ano=ano;
  let extra="";
  if(w===11&&dow===5)extra=`<div class="banner" style="--bc:var(--c-cat)"><strong>Avaliação do trimestre</strong>Hoje, no lugar das lições, faça as perguntas de narração da aba Semana (semana 11). A criança responde contando, oralmente${ano>=3?" ou por escrito":""}.</div>`;
  return head(eb,dayTitle)+extra+habitBox(ano,t)+`<div class="notice">Toque no ícone da câmera ao lado de cada aula para registrar fotos, resumo e observações no Diário.</div>`+dayLessons(ano,t,w,dow,dk)+afternoon(dow);
}
function lastBanner(){
  const L=prof.last;if(!L||!L.label)return "";
  return `<div class="resume"><div><div class="eyebrow">Você parou aqui</div><b>${esc(L.label)}</b><div class="muted" style="font-size:.85rem">${L.ano?L.ano+"º ano · "+L.t+"º trimestre · semana "+L.w+" · ":""}marcado em ${parseISO(L.date).toLocaleDateString("pt-BR")}</div></div>${L.ano?`<button type="button" class="btn primary" data-goto="${L.ano}-${L.t}-${L.w}">Continuar</button>`:""}</div>`;

function afternoon(dow){

function habitBox(ano,t){

/* ---------- Semana ---------- */
function weekProgress(ano,t,w){let n=0;ORDER.forEach(k=>{if(isDone(`w:${ano}:${t}:${w}:${k}`))n++});return n/ORDER.length}
function vSemana(){
  const {ano,t,w}=st;const p=yearPlan(ano);const T=p.terms[t-1];
  const ws=addDays(T.start,(w-1)*7),we=addDays(ws,4);
  const termBtns=[1,2,3].map(x=>`<button type="button" data-term="${x}" aria-pressed="${x===t}">${x}º trimestre</button>`).join("");
  const weekBtns=Array.from({length:12},(_,i)=>{const n=i+1;const pr=n<12?weekProgress(ano,t,n):0;return `<button type="button" data-week="${n}" class="${n===12?"rest":""}" aria-pressed="${n===w}" aria-label="Semana ${n}${n===12?" (descanso)":""}">${n===12?"D":n}${n<12?`<span class="prog"><i style="width:${Math.round(pr*100)}%"></i></span>`:""}</button>`}).join("");
  let body;
  if(w===12){
    body=`<div class="banner" style="--bc:var(--c-edf)"><strong>Semana 12: descanso</strong>${fmt(ws)} a ${fmt(we)}. Sem lições formais. Revise o diário da natureza, organize cadernos e prepare os livros do próximo trimestre.</div>`;
  }else{
    const pr=weekProgress(ano,t,w);
    const today=new Date();const regDate=(today>=ws&&today<=addDays(we,1))?iso(today):iso(ws);
    const cards=ORDER.map(k=>{
      const a=assignment(ano,k,t,w);const key=`w:${ano}:${t}:${w}:${k}`;const done=isDone(key);
      const d=termData(ano,k,t);
      const list=k==="lin"?`<ul>${d.t.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";
      const nreg=recs.filter(r=>r.ano===ano&&r.t===t&&r.w===w&&r.subj===k).length;
      let wb=weekBooks(ano,t,w,k).map(x=>bookLine(x,true)).join("");
      if(k==="bib"&&mhOn()){const L=bibWeekLists(ano,t,w);wb=`<div class="bk prep"><span>Preparação dos pais: <b>Matthew Henry</b> sobre ${esc(fmtRange(L.at))} e ${esc(fmtRange(L.nt))}</span></div>`+wb}
      return `<article class="card s-${k}${done?" done":""}"><div class="head"><span class="tag">${badge(k)}${esc(S[k].n)}</span><input class="chk" type="checkbox" id="c-${key}" data-key="${key}" data-label="${esc(S[k].n+" · "+a.main)}" ${done?"checked":""} aria-label="Semana concluída: ${esc(S[k].n)}"></div><div class="body"><div class="assign">${k==="lin"?"Foco: "+esc(a.main):esc(a.main)}</div>${wb?`<div class="bks">${wb}</div>`:""}${a.sub&&k!=="lin"?`<div class="meta">${esc(a.sub)}</div>`:""}${list}${k==="lin"&&a.sub?`<div class="meta">${esc(a.sub)}</div>`:""}<div class="meta">${esc(S[k].how)}</div><div class="row"><button type="button" class="btn color" data-reg="${k}" data-rdate="${regDate}" data-rlabel="${esc(a.main)}">${svg("cam",15)} Registrar aula</button>${nreg?`<span class="pill">${nreg} registro${nreg>1?"s":""}</span>`:""}</div></div></article>`;
    }).join("");
    let aval="";
    if(w===11){
      const qs=["his","cie","geo","art","mus"].map(k=>{const d=termData(ano,k,t);const pick=d.t[Math.min(d.t.length-1,2)];return `<li><b class="s-${k}" style="color:var(--sc)">${esc(S[k].n)}:</b> Conte tudo o que você sabe sobre “${esc(pick)}”.</li>`});
      const b=BIB[ano][t-1];
      qs.unshift(`<li><b class="s-bib" style="color:var(--sc)">Bíblia:</b> Escolha uma história de ${esc(b.at[0][0])} que você ouviu neste trimestre e conte-a com todos os detalhes.</li>`);
      qs.push(`<li><b class="s-lin" style="color:var(--sc)">Literatura:</b> Narre a parte de que você mais gostou do livro do trimestre.</li>`);
      qs.push(`<li><b class="s-rec" style="color:var(--sc)">Recitação:</b> A criança recita o Salmo e um poema do trimestre.</li><li><b class="s-cat" style="color:var(--sc)">Catecismo:</b> Os pais escolhem três perguntas do trimestre.</li>`);
      aval=`<div class="banner" style="--bc:var(--c-cat)"><strong>Avaliação do trimestre · sexta-feira da semana 11</strong><p class="muted" style="margin:4px 0 8px">No modelo dos apêndices do livro: perguntas abertas, respondidas por narração. Não há nota; observe o que a criança sabe.</p><ol style="margin:0;padding-left:1.2em;display:grid;gap:4px">${qs.join("")}</ol></div>`;
    }
    body=`<div class="row"><span class="pill">${fmt(ws)} a ${fmt(we)}</span><div class="progress" role="img" aria-label="Progresso da semana ${Math.round(pr*100)}%"><i style="width:${Math.round(pr*100)}%"></i></div><span class="muted" style="font-variant-numeric:tabular-nums;font-weight:700">${Math.round(pr*ORDER.length)} de ${ORDER.length} matérias</span></div>${aval}<div class="cards">${cards}</div>`;
  }
  return `<div><div class="eyebrow">${ano}º ano · ${ano+5} anos</div><div class="lead">Plano da semana</div></div><div class="termsel">${termBtns}</div><div class="weekbar">${weekBtns}</div>${habitBox(ano,t)}${body}`;
}

/* ---------- Visão geral, Horário, Calendário ---------- */
function vTri(){

  const flat=segs=>segs.flatMap(([bk,a,z])=>Array.from({length:z-a+1},(_,i)=>[bk,a+i]));

    if(k==="bib"){const b=BIB[ano][t-1];det=`<ol style="list-style:none;padding:0"><li>AT: ${esc(fmtRange(flat(b.at)))}</li><li>NT: ${esc(fmtRange(flat(b.nt)))}</li></ol>`}

function vCal(){

/* ---------- Diário e fotos ---------- */
const STATUS={ok:"Aula concluída",and:"Em andamento",rev:"Precisa revisar"};

function vForm(){

/* ---------- ações do diário ---------- */
function openForm(subj,date,label){
  const d=newDraft(subj,date,label||curLabelFor(subj||"bib",date||iso(new Date())));
  st.draft=d;st.tab="diario";store.set("tab","diario");render();
  const fb=document.getElementById("formbox");if(fb)fb.scrollIntoView({block:"start"});
}
let saving=false;
async function saveDraft(){
  if(saving)return;const d=st.draft;if(!d)return;
  saving=true;const b=document.getElementById("fsave");if(b){b.disabled=true;b.textContent="Salvando…"}
  try{
    const fotos=[];
    for(const f of d.fotos){
      if(f.blob){const s=await storePhoto(f.blob);fotos.push(Object.assign({id:s.id,cloud:!!s.cloud,legenda:f.legenda||"",comentarios:[]},s.db?{db:true}:{}))}
      else fotos.push(Object.assign({id:f.id,cloud:!!f.cloud,legenda:f.legenda||"",comentarios:f.comentarios||[]},f.db?{db:true}:{}));
    }
    const loc=locate(parseISO(d.date));
    const old=d.id?recs.find(x=>x.id===d.id):null;
    const r={id:d.id||("r"+newId()),date:d.date,ano:+d.ano,t:loc&&!loc.gap?loc.t:0,w:loc&&!loc.gap?loc.w:0,subj:d.subj,aula:d.aula.trim(),status:d.status,resumo:d.resumo.trim(),obs:d.obs.trim(),quem:d.quem,fotos,ts:old?old.ts:Date.now()};
    store.set("quem",d.quem);
    await saveRecord(r);
    d.fotos.forEach(f=>{if(f.preview)URL.revokeObjectURL(f.preview)});
    st.draft=null;st.dsubj="todas";st.dano=0;toast("Registro salvo.");render();scrollTo(0,0);
  }catch(e){
    const code=e&&e.code;
    toast(e&&e.message==="decode"?"Não foi possível ler essa foto. Tente outra.":e&&e.message==="toolarge"?"A foto é grande demais.":code==="too_large"?"A foto é grande demais.":code==="quota_or_state"||code==="quota_exceeded"?"O espaço de armazenamento acabou. Exclua fotos antigas.":"Não foi possível salvar. Tente de novo.");
    if(b){b.disabled=false;b.textContent="Salvar registro"}
  }finally{saving=false}
}
async function addFiles(files){
  if(!st.draft)return;
  let n=0;
  for(const file of files){
    if(file.type&&!file.type.startsWith("image/"))continue;n++;
    const blob=await compress(file);
    st.draft.fotos.push({blob,preview:URL.createObjectURL(blob),legenda:""});
  }
  toast(n?(n===1?"Foto adicionada. Não esqueça de salvar o registro.":n+" fotos adicionadas. Não esqueça de salvar o registro."):"Nenhuma imagem foi recebida.");
  render();const fb=document.querySelector(".thumbs");if(fb)fb.scrollIntoView({block:"nearest"});
}
async function updateRecord(rid,fn){
  const r=recs.find(x=>x.id===rid);if(!r)return;
  const copy=JSON.parse(JSON.stringify(r));fn(copy);
  try{await saveRecord(copy);if(cloud.mode!=="cloud"){renderViewer();render()}}catch(e){toast("Não foi possível salvar. Tente de novo.")}
}

/* ---------- eventos ---------- */
const armed={};
function arm(btn,key,label,fn){
  if(armed[key]){clearTimeout(armed[key]);delete armed[key];fn();return}
  btn.classList.add("armed");const old=btn.textContent;btn.textContent=label;
  armed[key]=setTimeout(()=>{delete armed[key];btn.classList.remove("armed");btn.textContent=old},4000);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");

  if(ds.logout){if(window.FB_AUTH){FB_AUTH.signOut().finally(()=>location.reload());return}prof.email="";prof.last=null;store.set("email","");profSaved="";render();scrollTo(0,0);return}
  if(ds.forgot){const em=(document.getElementById("l-email").value||"").trim();const er=document.getElementById("l-err");if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){er.textContent="Digite seu e-mail acima e toque de novo em “Esqueci minha senha”.";er.hidden=false;return}FB_AUTH.sendPasswordResetEmail(em).then(()=>{er.hidden=true;toast("Enviamos um e-mail para criar uma nova senha.")}).catch(()=>{er.textContent="Não foi possível enviar o e-mail. Confira o endereço.";er.hidden=false});return}
  if(ds.goto){const [a,t,w]=ds.goto.split("-").map(Number);st.ano=a;st.t=t;st.w=w;st.tab="semana";render();scrollTo(0,0);return}
  if(ds.ano){st.ano=+ds.ano;store.set("ano",st.ano);if(st.tab==="hoje"){st.tab="semana";store.set("tab","semana")}render()}

  else if(ds.term){st.t=+ds.term;store.set("t",st.t);render()}
  else if(ds.week){st.w=+ds.week;store.set("w",st.w);render()}
  else if(ds.day!=null){const n=+ds.day;if(n===0)st.day=null;else{const d=st.day?parseISO(st.day):new Date();st.day=iso(addDays(d,n))}render()}
  else if(ds.reg){openForm(ds.reg,ds.rdate,ds.rlabel)}
  else if(ds.newrec){openForm(null,null,null)}
  else if(ds.fcancel){if(st.draft)st.draft.fotos.forEach(f=>{if(f.preview)URL.revokeObjectURL(f.preview)});st.draft=null;render()}
  else if(ds.fsubj){const d=st.draft;const auto=!d.aula||d.aula===curLabelFor(d.subj,d.date);d.subj=ds.fsubj;if(auto)d.aula=curLabelFor(d.subj,d.date);render()}
  else if(ds.st&&st.draft){st.draft.status=ds.st;render()}
  else if(ds.rmfoto!=null&&st.draft){const f=st.draft.fotos.splice(+ds.rmfoto,1)[0];if(f&&f.preview)URL.revokeObjectURL(f.preview);render()}
  else if(ds.fsave){saveDraft()}
  else if(ds.dview){st.dview=ds.dview;store.set("dview",st.dview);render()}
  else if(ds.dsubj){st.dsubj=ds.dsubj;render()}
  else if(ds.dano!=null){st.dano=+ds.dano;render()}
  else if(ds.edit){const r=recs.find(x=>x.id===ds.edit);if(r){st.draft={id:r.id,date:r.date,ano:r.ano,subj:r.subj,aula:r.aula||"",status:r.status||"ok",resumo:r.resumo||"",obs:r.obs||"",quem:r.quem||"Mãe",fotos:(r.fotos||[]).map(f=>Object.assign({},f))};render();scrollTo(0,0)}}
  else if(ds.del){arm(b,"del"+ds.del,"Confirmar exclusão",async()=>{const r=recs.find(x=>x.id===ds.del);if(r){try{await deleteRecord(r);toast("Registro excluído.");render()}catch(err){toast("Não foi possível excluir.")}}})}
  else if(ds.open){openPhoto={rid:ds.open,i:+ds.fi};renderViewer()}
  else if(ds.vclose){openPhoto=null;renderViewer()}
  else if(ds.vnav){const r=recs.find(x=>x.id===openPhoto.rid);const n=(r.fotos||[]).length;openPhoto.i=(openPhoto.i+(+ds.vnav)+n)%n;renderViewer()}
  else if(ds.vcom){const inp=document.getElementById("v-com");const t=(inp.value||"").trim();if(!t)return;const i=openPhoto.i;updateRecord(openPhoto.rid,r=>{const f=r.fotos[i];f.comentarios=f.comentarios||[];f.comentarios.push({t,quem:store.get("quem","Mãe"),ts:Date.now()})});inp.value="";toast("Comentário adicionado.")}
  else if(ds.vleg){const v=document.getElementById("v-leg").value;const i=openPhoto.i;updateRecord(openPhoto.rid,r=>{r.fotos[i].legenda=v.trim()});toast("Legenda salva.")}
  else if(ds.vdel){const {rid,i}=openPhoto;arm(b,"vdel"+rid+i,"Confirmar exclusão",()=>{const r=recs.find(x=>x.id===rid);const f=r&&r.fotos[i];updateRecord(rid,c=>{c.fotos.splice(i,1)});delPhotoAny(f);openPhoto=null;renderViewer();toast("Foto excluída.")})}
});

document.addEventListener("input",e=>{

  const t=e.target,d=st.draft;if(!d)return;
  if(t.id==="f-aula")d.aula=t.value;else if(t.id==="f-resumo")d.resumo=t.value;else if(t.id==="f-obs")d.obs=t.value;
  else if(t.dataset.leg!=null&&d.fotos[+t.dataset.leg])d.fotos[+t.dataset.leg].legenda=t.value;
});
document.addEventListener("change",e=>{
  const t=e.target;const d=st.draft;
  if(t.dataset.usebook){if(t.checked)delete ub.ocultos[t.dataset.usebook];else ub.ocultos[t.dataset.usebook]=1;saveUB();render();return}
  if(t.dataset.bf&&st.bdraft){const f=t.dataset.bf;st.bdraft[f]=t.value;if(f==="k"){st.bdraft.dia="0";if(t.value!=="lin")st.bdraft.slot="Literatura"}if(f==="ano"){st.bdraft.dia="0";if(grp(+t.value)==="B")st.bdraft.slot="Literatura"}if(["k","ano","unit"].includes(f))render();return}
  if(t.dataset.got){if(t.checked)cfg.comprado[t.dataset.got]=1;else delete cfg.comprado[t.dataset.got];saveCfg();return}
  if(t.dataset.cfg){const m=t.dataset.cfg.match(/^(.+-\d+)-(from|to|unit|ano|t|k|w0|w1)$/);if(m){const o=cfg.u[m[1]]=cfg.u[m[1]]||{};o[m[2]]=t.value===""?null:(["unit","k"].includes(m[2])?t.value:+t.value);saveCfg();
    if(["from","to","unit"].includes(m[2])){const [bid,bi]=[m[1].slice(0,m[1].lastIndexOf("-")),+m[1].slice(m[1].lastIndexOf("-")+1)];const bk=BOOKS.find(x=>x.id===bid);if(bk){const u=effUse(bk,bi);const pv=document.getElementById(m[1]+"-prev");if(pv)pv.innerHTML=previewHTML(u,sessions(u))}}else render()}return}
  if(t.classList.contains("chk")&&t.dataset.key){setDone(t.dataset.key,t.checked,t.dataset.label);const box=t.closest(".lesson,.card");if(box)box.classList.toggle("done",t.checked);if(st.tab==="semana")render()}
  else if(t.id==="daypick"&&t.value){st.day=t.value;render()}
  else if(t.id==="startDate"&&t.value){store.set("start",t.value);render()}
  else if(t.id==="ano0"){store.set("ano0",+t.value);render()}
  else if(t.id==="julho"){store.set("julho",t.checked);render()}
  else if(d&&t.id==="f-date"&&t.value){const auto=!d.aula||d.aula===curLabelFor(d.subj,d.date);d.date=t.value;const l=locate(parseISO(d.date));if(l&&!l.gap)d.ano=l.ano;if(auto)d.aula=curLabelFor(d.subj,d.date);render()}
  else if(d&&t.id==="f-quem"){d.quem=t.value}
  else if(d&&t.id==="f-ano"){d.ano=+t.value}
  else if(d&&(t.id==="f-cam"||t.id==="f-gal")&&t.files&&t.files.length){addFiles(Array.from(t.files));t.value=""}
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&profTimer){clearTimeout(profTimer);profSaved="";const body=Object.assign(profSnapshot(),{upd:Date.now()});if(prof.email){store.set("perfil:"+pid(prof.email),body);if(cloud.db)cloud.db.collection("perfis").doc(pid(prof.email)).set(body).catch(()=>{})}}});
document.addEventListener("submit",e=>{
  if(e.target.id!=="loginform")return;e.preventDefault();
  if(window.FB_AUTH){
    const em=(document.getElementById("l-email").value||"").trim().toLowerCase(),pw=document.getElementById("l-pass").value||"";
    const er=document.getElementById("l-err"),go=document.getElementById("l-go");
    prof.quem=document.getElementById("l-quem").value;store.set("quem",prof.quem);
    go.disabled=true;go.textContent="Entrando…";er.hidden=true;
    FB_AUTH.signInWithEmailAndPassword(em,pw).catch(err=>{
      const c=err&&err.code||"";
      er.textContent=c.includes("network")?"Sem internet. Conecte-se e tente de novo.":c.includes("too-many")?"Muitas tentativas. Espere alguns minutos.":c.includes("invalid-email")?"Digite um e-mail válido.":"E-mail ou senha incorretos.";
      er.hidden=false;go.disabled=false;go.textContent="Entrar";
    });
    return;
  }
  const em=(document.getElementById("l-email").value||"").trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){document.getElementById("l-err").hidden=false;return}
  prof.email=em;prof.quem=document.getElementById("l-quem").value;store.set("email",em);store.set("quem",prof.quem);
  touched=false;prof.last=null;
  const p=store.get("perfil:"+pid(em),null);if(p)applyProfile(p);
  render();scrollTo(0,0);loadProfile();
});
if(location.hash){const h=location.hash.slice(1);if(TABS.some(([k])=>k===h))st.tab=h}
if(window.FB_AUTH){
  prof.email="";
  FB_AUTH.onAuthStateChanged(u=>{
    fbPending=false;
    if(u){prof.email=(u.email||"").toLowerCase();store.set("email",prof.email);const p=store.get("perfil:"+pid(prof.email),null);if(p)applyProfile(p);render();if(!cloud.db)connect();}
    else{prof.email="";render()}
  });
  render();
}else{
  if(prof.email){const p=store.get("perfil:"+pid(prof.email),null);if(p)applyProfile(p)}
  render();
  connect();
}
})();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
